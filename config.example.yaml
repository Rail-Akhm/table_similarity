# Example configuration for tablefp
# Copy this to config.yaml and edit for your environment

# ── Connection ────────────────────────────────────────────────────────────────
# PostgreSQL / Greenplum 6.24 connection string
dsn: "postgresql://user:password@localhost:5432/mydb"

# ── Tables to index ───────────────────────────────────────────────────────────
# Supports fnmatch globs (*, ?) in schema and table name.
# Examples:
#   "dwh.orders"         — exact table
#   "dwh.*"              — all tables in schema dwh
#   "dp_rid_*.*"         — all tables in schemas matching dp_rid_*
#   "stage.*_fact*"      — tables matching *_fact* in schema stage
tables:
  - "dwh.orders"
  - "dwh.customers"
  - "stage.*"

# ── Column filters ────────────────────────────────────────────────────────────

# Exclude by exact name (schema.table.column)
exclude_columns: []

# Exclude by fnmatch glob on column name
# Examples: "s_*" skips s__wrt_ts, s__wrt_id, etc.
#           "tmp_*" skips tmp_ prefixed columns
exclude_column_patterns:
  # - "s_*"

# Only index columns of these dtype groups (omit to index all)
# Valid groups: text, num, date, ts, bool, uuid
# dtype_groups: ["text"]

# ── Storage ───────────────────────────────────────────────────────────────────

# "local" — sqlite metadata + .npy files on disk (default, faster)
# "db"    — Greenplum table (tablefp_columns), shared across users
store_type: "local"

# Directory for local store (.npy files + catalog.db)
index_dir: "./fp_index"

# Connection string for DB store (defaults to dsn if omitted)
# storage_dsn: "postgresql://user:password@other-host:5432/indexdb"

# ── Indexing ──────────────────────────────────────────────────────────────────

# Maximum concurrent DB connections during indexing
max_workers: 4

# Low-memory mode: streams data directly to disk via DB-side ORDER BY + batch
# processing. Uses ~10× less RAM per column at the cost of ~20% slower indexing.
# Set to true when indexing large tables with limited RAM.
low_memory: false

# Skip text columns with average normalized length > this value
skip_text_avg_len: 500

# ── Matching ───────────────────────────────────────────────────────────────────

# Minimum containment fraction for column pairing/scoring (0.0–1.0)
min_containment: 0.3

# Minimum containment for the REPORTED "all matches" candidate list only
# (does NOT affect scoring/assignment). Lower this to surface weaker matches in
# the search/compare report without polluting the ranking. Defaults to
# min_containment. To also show weak FUZZY matches (e.g. a deposit name that is
# only a substring of a long free-text column), set fuzzy.enabled: true AND
# lower this, e.g. candidate_min_containment: 0.09
candidate_min_containment: 0.3

# Skip template columns with fewer than N distinct values
min_template_distinct: 5

# ── Fuzzy matching (Phase 2) ───────────────────────────────────────────────────
#
# When enabled, text columns use n-gram overlap to tolerate typos and small
# edits (e.g. 'иванов' vs 'ивонов'). Exact matching continues to work as
# before — fuzzy scoring only improves text-text column containment.
#
fuzzy:
  enabled: false

  # N-gram size (like pg_trgm)
  ngram_size: 3

  # Max distinct values for n-gram indexing (skip columns above this)
  max_nd: 2000000

  # Optional explicit column whitelist (fnmatch globs on column name)
  columns: []
  # columns: ["name", "city"]

  # Weight for n-gram containment vs exact containment
  # S = max(exact, alpha * ngram)
  alpha: 0.8

  # How the n-gram (fuzzy) similarity between two columns is scored:
  #   jaccard            |A∩B| / |A∪B|  — symmetric; a huge free-text column
  #                      ranks LOW even if it shares many trigrams (anti-sponge).
  #   coverage_weighted  |A∩B|² / (|A|·|A∪B|) — rewards the NUMBER of template
  #                      trigrams hit, so a column with many hits (e.g. deposit
  #                      names embedded as substrings of long strings) ranks
  #                      ABOVE incidental trigram noise, while a genuine
  #                      same-size match still wins. Use this if you want
  #                      high-hit columns like a long "division" surfaced.
  metric: jaccard

  # Minimum trigram_similarity threshold for row verification of fuzzy matches
  verify_sim_threshold: 0.4
